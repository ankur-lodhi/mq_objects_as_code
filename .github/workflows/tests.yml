name: Ansible regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: ['ansible-core>=2.18,<2.19', 'ansible-core>=2.19,<2.20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '${{ matrix.ansible }}' -r requirements-test.txt
      - run: ansible-playbook -i localhost, playbooks/configure_mq.yml --syntax-check
      - run: python -m unittest discover -s tests -v
