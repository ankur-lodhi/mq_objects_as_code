---
- name: Configure IBM MQ objects
  hosts: mqservers
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  become: true
  become_method: sudo
  become_user: root

  tasks:
    - name: Validate the server directory name
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        fail_msg: "Inventory hostnames must be plain server directory names."

    - name: Check the controller's object directory
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../objects/{{ inventory_hostname }}"
      delegate_to: localhost
      become: false
      register: mq_object_directory

    - name: Require an object directory for each server
      ansible.builtin.assert:
        that:
          - mq_object_directory.stat.isdir | default(false)
        fail_msg: "Missing objects/{{ inventory_hostname }} directory on the controller."

    - name: Discover MQ object files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../objects/{{ inventory_hostname }}"
        patterns: ['*.yml', '*.yaml']
        file_type: file
        recurse: false
      delegate_to: localhost
      become: false
      register: mq_object_files

    - name: Build the list of MQ object files
      ansible.builtin.set_fact:
        mq_object_file_names: "{{ mq_object_files.files | map(attribute='path') | map('basename') | list }}"

    - name: Reject unrecognized object files
      ansible.builtin.assert:
        that:
          - mq_object_file_names | difference(mq_supported_files) | length == 0
        fail_msg: "Unsupported object files: {{ mq_object_file_names | difference(mq_supported_files) }}"
      vars:
        mq_supported_files:
          - queues.yml
          - channels.yml
          - listeners.yml
          - topics.yml
          - subscriptions.yml
          - mq_auth_records.yml
          - mq_chlauth.yml

    # Complete every available validation before the first MQ command. With
    # linear execution and any_errors_fatal, a bad host also stops its peers.
    - name: Validate queue configuration
      ansible.builtin.include_tasks: ../validation/queue_validation.yml
      when: "'queues.yml' in mq_object_file_names"

    - name: Validate channel configuration
      ansible.builtin.include_tasks: ../validation/validate_channels.yml
      when: "'channels.yml' in mq_object_file_names"

    - name: Validate listener configuration
      ansible.builtin.include_tasks: ../validation/validate_listeners.yml
      when: "'listeners.yml' in mq_object_file_names"

    - name: Validate topic configuration
      ansible.builtin.include_tasks: ../validation/validate_topics.yml
      when: "'topics.yml' in mq_object_file_names"

    - name: Validate subscription configuration
      ansible.builtin.include_tasks: ../validation/validate_subscriptions.yml
      when: "'subscriptions.yml' in mq_object_file_names"

    - name: Configure queues
      ansible.builtin.include_tasks: ../tasks/configure_queues.yml
      when: "'queues.yml' in mq_object_file_names"

    - name: Configure channels
      ansible.builtin.include_tasks: ../tasks/configure_channels.yml
      when: "'channels.yml' in mq_object_file_names"

    - name: Configure listeners
      ansible.builtin.include_tasks: ../tasks/configure_listeners.yml
      when: "'listeners.yml' in mq_object_file_names"

    - name: Configure topics
      ansible.builtin.include_tasks: ../tasks/configure_topics.yml
      when: "'topics.yml' in mq_object_file_names"

    - name: Configure subscriptions
      ansible.builtin.include_tasks: ../tasks/configure_subscriptions.yml
      when: "'subscriptions.yml' in mq_object_file_names"

    - name: Configure authority records
      ansible.builtin.include_tasks: ../tasks/configure_authrecords.yml
      when: "'mq_auth_records.yml' in mq_object_file_names"

    - name: Configure channel authentication records
      ansible.builtin.include_tasks: ../tasks/configure_chlauth.yml
      when: "'mq_chlauth.yml' in mq_object_file_names"
