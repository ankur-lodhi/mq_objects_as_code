---
- name: Load topic configuration
  ansible.builtin.include_vars:
    file: ../objects/{{ inventory_hostname }}/topics.yml

- name: Validate topic list
  ansible.builtin.assert:
    that:
      - >-
        mq_topics is defined and mq_topics is sequence
        and mq_topics is not string and mq_topics is not mapping
    fail_msg: "mq_topics must be a YAML list."

- name: Validate topic field types
  ansible.builtin.assert:
    that:
      - >-
        topic is mapping
        and topic.name is defined and topic.name is string
        and topic.topic_str is defined and topic.topic_str is string
        and topic.host_qmgr is defined and topic.host_qmgr is string
    fail_msg: "Topic fields have invalid types: {{ topic }}"
  loop: "{{ mq_topics }}"
  loop_control:
    loop_var: topic
    label: "{{ topic.name | default('unnamed') }}"

- name: Validate topic attributes
  ansible.builtin.assert:
    that:
      - topic.name | length > 0 and topic.name | length <= 48
      - topic.name is match('^[A-Za-z0-9._/%]+$')
      - topic.topic_str | length > 0 and topic.topic_str | length <= 10240
      - topic.host_qmgr | length > 0 and topic.host_qmgr | length <= 48
      - topic.host_qmgr is match('^[A-Za-z0-9._/%$#@]+$')
    fail_msg: "Topic {{ topic.name }} has a missing or invalid attribute."
  loop: "{{ mq_topics }}"
  loop_control:
    loop_var: topic
    label: "{{ topic.name | default('unnamed') }}"

- name: Reject control characters in topic fields
  ansible.builtin.assert:
    that:
      - >-
        topic.name is not search('[\x00-\x1f\x7f-\x9f]')
        and topic.topic_str is not search('[\x00-\x1f\x7f-\x9f]')
        and topic.host_qmgr is not search('[\x00-\x1f\x7f-\x9f]')
    fail_msg: "Topic fields cannot contain control characters."
  loop: "{{ mq_topics }}"
  loop_control:
    loop_var: topic
    label: "{{ topic.name | default('unnamed') }}"

- name: Validate duplicate topic identities
  ansible.builtin.assert:
    that:
      - topic_identities | length == topic_identities | unique(case_sensitive=true) | length
    fail_msg: "Duplicate topic name and queue manager identity found."
  vars:
    topic_identities: "{{ mq_topics | map(attribute='name') | zip(mq_topics | map(attribute='host_qmgr')) | map('to_json') | list }}"
